name: Preprocessing Pipeline - Adult Income Dataset

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'preprocessing/**'
      - 'dataset_raw/**'
      - '.github/workflows/preprocessing.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan menjalankan pipeline secara manual'
        required: false
        default: 'Manual trigger by user'

jobs:
  preprocessing:
    name: Run Preprocessing Pipeline
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout repository ────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Setup Python ────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ─── 3. Cache pip packages ──────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-preprocessing
          restore-keys: |
            ${{ runner.os }}-pip-

      # ─── 4. Install dependencies ────────────────────────────────
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib

      # ─── 5. Verify dataset exists ───────────────────────────────
      - name: Verify Raw Dataset
        run: |
          echo "Checking dataset_raw directory..."
          ls -lh dataset_raw/
          echo "Dataset file size: $(du -sh dataset_raw/adult.data | cut -f1)"

      # ─── 6. Run preprocessing script ────────────────────────────
      - name: Run Preprocessing Script
        run: |
          echo "Starting preprocessing pipeline..."
          python preprocessing/automate_SuryaHanjaya.py
          echo "Preprocessing complete!"

      # ─── 7. Verify output files ─────────────────────────────────
      - name: Verify Output Files
        run: |
          echo "Checking preprocessing output files..."
          ls -lh preprocessing/
          echo "CSV file size: $(du -sh preprocessing/adult_income_preprocessed.csv | cut -f1)"
          echo "Scaler file size: $(du -sh preprocessing/scaler.pkl | cut -f1)"
          python -c "
          import pandas as pd
          df = pd.read_csv('preprocessing/adult_income_preprocessed.csv')
          print(f'Preprocessed dataset shape: {df.shape}')
          print(f'Columns count: {len(df.columns)}')
          print(f'Target distribution:')
          print(df['income'].value_counts())
          print('Missing values:', df.isnull().sum().sum())
          "

      # ─── 8. Upload preprocessed artifacts ───────────────────────
      - name: Upload Preprocessed Dataset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adult-income-preprocessed-${{ github.run_number }}
          path: |
            preprocessing/adult_income_preprocessed.csv
            preprocessing/scaler.pkl
          retention-days: 30

      # ─── 9. Summary ─────────────────────────────────────────────
      - name: Print Summary
        run: |
          echo "======================================================"
          echo "  Preprocessing Pipeline — COMPLETED SUCCESSFULLY"
          echo "======================================================"
          echo "Run number    : ${{ github.run_number }}"
          echo "Triggered by  : ${{ github.event_name }}"
          echo "Branch        : ${{ github.ref_name }}"
          echo "Repo          : https://github.com/suryahanjaya/adult-income-classifier"
          echo "Artifact name : adult-income-preprocessed-${{ github.run_number }}"
          echo "======================================================"
